name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Extraer versión
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$($version.Contains('-'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publicar e instalar
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -RepositoryUrl "https://github.com/${{ github.repository }}"

      - name: Verificar publicación
        shell: pwsh
        run: .\scripts\verify-release.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: kohana-${{ steps.version.outputs.value }}
          path: |
            artifacts/dist/*.zip
            artifacts/dist/*.sha256
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
          if-no-files-found: error

      # Diseño D67 — publicar en la release exista o no.
      #
      # Hasta aquí este paso solo sabía CREARLA, y la release ya existe cuando llega: se crea al
      # publicar la versión, antes de que el flujo termine. gh respondía "a release with the same
      # tag name already exists", el paso fallaba, y con él se perdían los artefactos que este
      # trabajo acababa de construir. Las cinco últimas versiones se publicaron así: **con el zip
      # portable y sin instalador**, porque el instalador solo lo arma este flujo.
      - name: Publicar artefactos en la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"

          $assets = Get-ChildItem `
            artifacts\dist\*.zip,
            artifacts\dist\*.sha256,
            artifacts\installer\*.exe,
            artifacts\installer\*.sha256 |
            ForEach-Object { $_.FullName }

          # Sin instalador no hay publicación: es la mitad de lo que este trabajo existe para hacer,
          # y su ausencia pasó semanas sin que nadie lo notara.
          if (-not ($assets | Where-Object { $_ -like "*Setup.exe" })) {
            throw "No se construyó ningún instalador; no se publica nada."
          }

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "==> La release $tag ya existe; se le añaden los artefactos."
            & gh release upload $tag --clobber @assets
          }
          else {
            $arguments = @(
              "release", "create", $tag,
              "--title", "Sakura ${{ steps.version.outputs.value }}",
              "--generate-notes"
            )

            if ("${{ steps.version.outputs.prerelease }}" -eq "True") {
              $arguments += "--prerelease"
            }

            & gh @arguments @assets
          }

          if ($LASTEXITCODE -ne 0) {
            throw "No se pudieron publicar los artefactos en $tag."
          }
